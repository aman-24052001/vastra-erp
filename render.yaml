services:
  - type: web
    name: vastra-erp-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m app.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VASTRA_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3
